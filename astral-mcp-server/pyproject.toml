[project]
name = "astral-mcp-server"
version = "0.1.0"
description = "High-performance Celestial Ephemeris, Astrological State Machine, and Mass Dataset Feature Enrichment MCP Server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "ephemeris", "astrology", "vedic", "astronomy", "swiss-ephemeris", "planetary-positions", "feature-engineering", "seismic", "time-series"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "mcp>=1.0.0",
    "pyswisseph>=2.10.3.2",
    "numpy>=1.26.0",
    "pytz>=2024.1",
    "python-dateutil>=2.9.0",
    "pydantic>=2.0.0",
]

[project.scripts]
astral-ephemeris = "astral_engine.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astral_engine"]

[tool.hatch.build.targets.sdist]
include = [
    "astral_engine",
    "server.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "data/sample_events.csv",
    "configs/*",
]
